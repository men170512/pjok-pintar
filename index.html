<style>
:root{--navy:#123b75;--blue:#1769d2;--sky:#eaf3ff;--ink:#17243a;--muted:#64748b;--line:#e4ebf5;--white:#fff;--green:#16865b;--gold:#f5b82e;--shadow:0 12px 32px rgba(18,59,117,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f8fd;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topinner{display:flex;align-items:center;justify-content:space-between;padding:13px 22px;gap:16px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;color:var(--navy);font-size:19px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#1769d2,#0c3976);display:grid;place-items:center;color:white;font-size:22px;box-shadow:0 6px 14px #1769d244}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav button{border:0;background:transparent;color:#53647d;padding:10px 12px;border-radius:10px;font-weight:700}.nav button.active,.nav button:hover{background:var(--sky);color:var(--blue)}.menu{display:none;border:0;background:var(--sky);border-radius:10px;padding:9px 12px;color:var(--navy)}main{padding:25px 22px 90px}.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#10366d,#1769d2 65%,#35a4e8);border-radius:26px;color:white;padding:34px;display:grid;grid-template-columns:1.35fr .65fr;gap:20px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:300px;height:300px;border:1px solid #ffffff25;border-radius:50%;right:5%;top:-115px;box-shadow:0 0 0 28px #ffffff0b,0 0 0 58px #ffffff08}.eyebrow{font-size:12px;letter-spacing:1.5px;font-weight:850;color:#c9e5ff;text-transform:uppercase}.hero h1{font-size:clamp(29px,5vw,48px);line-height:1.08;margin:12px 0}.hero p{color:#e4f1ff;max-width:590px;line-height:1.65;margin:0 0 20px}.hero-art{position:relative;z-index:1;display:grid;place-items:center;font-size:112px;min-height:190px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;background:var(--blue);color:white;box-shadow:0 5px 12px #1769d233}.btn.light{background:white;color:var(--navy)}.btn.outline{background:white;color:var(--blue);border:1px solid #cfe0f7;box-shadow:none}.btn.small{padding:8px 11px;font-size:13px}.section{margin-top:29px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}.section h2{font-size:22px;margin:0;color:#152e54}.section-head p{margin:5px 0 0;color:var(--muted);font-size:14px}.textlink{border:0;background:transparent;color:var(--blue);font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.stat,.card,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 5px 18px #183c6b08}.stat{display:flex;align-items:center;gap:13px}.stat-icon{width:43px;height:43px;display:grid;place-items:center;background:var(--sky);border-radius:13px;font-size:21px}.stat strong{font-size:23px;color:var(--navy);display:block}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sport-card{padding:0;overflow:hidden;transition:.2s}.sport-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.sport-top{height:105px;display:grid;place-items:center;font-size:55px;background:linear-gradient(135deg,#e7f2ff,#f7fbff)}.sport-body{padding:15px}.sport-body h3{margin:0 0 6px;font-size:17px}.sport-body p{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 12px}.tag{display:inline-block;background:#eef5ff;color:#2866b5;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:800}.lesson-list{display:grid;gap:11px}.lesson{display:flex;align-items:center;gap:13px;padding:14px;background:white;border:1px solid var(--line);border-radius:15px}.lesson-emoji{width:45px;height:45px;border-radius:13px;background:var(--sky);display:grid;place-items:center;font-size:23px}.lesson-info{flex:1}.lesson-info strong{display:block}.lesson-info small{color:var(--muted)}.page-title{margin:3px 0 7px;font-size:29px;color:#152e54}.lead{color:var(--muted);line-height:1.6;margin:0 0 20px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel h3{margin:0 0 10px}.panel p,.panel li{line-height:1.65;color:#53647d;font-size:14px}.panel ul{padding-left:19px}.search{width:100%;padding:12px 14px;border:1px solid #d8e3f1;border-radius:12px;background:white;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769d21a}.quiz-q{font-weight:800;font-size:17px;margin:15px 0}.option{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:white;margin:9px 0;color:var(--ink)}.option.selected{border-color:var(--blue);background:#eef5ff}.option.correct{border-color:#1a9a68;background:#eaf8f1}.option.wrong{border-color:#df5b5b;background:#fff0f0}.feedback{padding:12px;border-radius:12px;margin:12px 0;font-size:14px}.feedback.good{background:#eaf8f1;color:#126b49}.feedback.bad{background:#fff3e8;color:#8c4d13}.progress{height:9px;background:#e8eef7;border-radius:20px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#1769d2,#35a4e8);width:0;transition:.3s}.empty{padding:30px;text-align:center;color:var(--muted);background:white;border:1px dashed #cbd8e8;border-radius:16px}.footer{text-align:center;color:#8090a5;font-size:12px;padding:28px 12px 5px}.mobile-nav{display:none}.hidden{display:none!important}.detail-hero{background:linear-gradient(120deg,#eaf3ff,#fff);border:1px solid #dce9fa;border-radius:18px;padding:20px;margin:15px 0}.detail-hero .big{font-size:48px}.detail-hero h2{margin:5px 0;color:var(--navy)}.muted{color:var(--muted)}.pillrow{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
@media(max-width:760px){.topinner{padding:10px 15px}.nav{display:none;position:absolute;top:64px;left:12px;right:12px;background:white;border:1px solid var(--line);border-radius:15px;padding:8px;box-shadow:var(--shadow)}.nav.open{display:grid;grid-template-columns:1fr 1fr}.nav button{text-align:left}.menu{display:block}main{padding:17px 14px 92px}.hero{grid-template-columns:1fr;padding:25px 21px;border-radius:20px}.hero-art{display:none}.hero h1{font-size:34px}.stats{gap:8px}.stat{padding:12px;display:block}.stat-icon{margin-bottom:7px}.stat strong{font-size:20px}.stat span{font-size:11px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.sport-top{height:82px;font-size:43px}.sport-body{padding:12px}.sport-body h3{font-size:15px}.sport-body p{font-size:12px}.two-col{grid-template-columns:1fr}.mobile-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -5px 18px #183c6b0b}.mobile-nav button{border:0;background:transparent;color:#718198;font-size:10px;font-weight:800;display:grid;gap:3px;justify-items:center;padding:5px 8px}.mobile-nav button span{font-size:19px}.mobile-nav button.active{color:var(--blue)}.section h2{font-size:20px}.page-title{font-size:25px}}
</style>

<body>
<div class="app">
<header class="topbar"><div class="topinner">
  <div class="brand"><div class="logo">🏅</div><div>PJOK Pintar<small style="display:block;font-size:10px;color:#7b8ca4;font-weight:650;letter-spacing:.4px">MEDIA PEMBELAJARAN PJOK</small></div></div>
  <nav class="nav" id="nav">
    <button data-page="home" class="active">Beranda</button><button data-page="materi">Materi</button><button data-page="video">Video</button><button data-page="kuis">Kuis</button><button data-page="progres">Progres</button><button data-page="tentang">Tentang</button>
  </nav>
  <button class="menu" id="menuBtn" aria-label="Buka menu">☰</button>
</div></header>
<main id="main"></main>
<nav class="mobile-nav" aria-label="Navigasi bawah">
<button data-page="home" class="active"><span>⌂</span>Beranda</button><button data-page="materi"><span>📚</span>Materi</button><button data-page="kuis"><span>✍️</span>Kuis</button><button data-page="progres"><span>📈</span>Progres</button><button data-page="tentang"><span>ℹ️</span>Tentang</button>
</nav>
</div>
<script>
const sports=[
{id:'sepakbola',name:'Sepak Bola',emoji:'⚽',level:'Dasar',desc:'Mengenal teknik dasar permainan sepak bola.',goal:'Memahami gerak dasar dan aturan sederhana permainan sepak bola.',skills:[['Passing','Mengoper bola kepada teman. Gunakan kaki bagian dalam agar arah operan lebih terkontrol.'],['Dribbling','Menggiring bola dengan sentuhan pendek menggunakan kaki bagian dalam dan luar.'],['Shooting','Menendang bola ke arah sasaran dengan memperhatikan kaki tumpu dan keseimbangan.'],['Controlling','Menghentikan atau menguasai bola menggunakan kaki bagian dalam, telapak kaki, atau paha.']],safety:'Lakukan pemanasan, gunakan lapangan yang aman, dan jaga jarak antarpemain.'},
{id:'voli',name:'Bola Voli',emoji:'🏐',level:'Dasar',desc:'Mempelajari keterampilan dasar bola voli.',goal:'Memahami cara memainkan bola dan bekerja sama dalam tim.',skills:[['Passing bawah','Rapatkan kedua lengan dan gunakan bidang lengan bawah untuk menerima bola.'],['Passing atas','Buka jari-jari tangan di atas dahi dan dorong bola dengan koordinasi jari.'],['Servis bawah','Pegang bola di depan badan, ayunkan tangan dari bawah untuk mengirim bola melewati net.'],['Smash','Lakukan awalan, lompatan terkontrol, lalu pukul bola ke area lawan.']],safety:'Periksa kondisi lapangan dan tiang net. Hindari bertabrakan saat mengejar bola.'},
{id:'basket',name:'Bola Basket',emoji:'🏀',level:'Dasar',desc:'Belajar koordinasi, kontrol bola, dan kerja sama.',goal:'Menguasai keterampilan dasar permainan bola basket.',skills:[['Dribbling','Pantulkan bola dengan ujung jari, jaga bola di samping tubuh, dan lihat ke depan.'],['Chest pass','Pegang bola di depan dada lalu dorong lurus ke arah dada teman.'],['Bounce pass','Dorong bola ke lantai sekitar dua pertiga jarak menuju penerima.'],['Shooting','Fokus pada ring, tekuk lutut, dan lepaskan bola dengan gerakan lanjutan pergelangan tangan.']],safety:'Gunakan sepatu yang sesuai dan beri ruang saat melakukan latihan tembakan.'},
{id:'atletik',name:'Atletik',emoji:'🏃',level:'Dasar',desc:'Mengenal jalan, lari, lompat, dan lempar.',goal:'Mengembangkan keterampilan gerak dasar dan kebugaran.',skills:[['Lari jarak pendek','Mulai dari posisi siap, dorong tubuh ke depan, dan ayunkan lengan seirama langkah.'],['Lompat jauh','Lakukan awalan, tolakan satu kaki pada papan, melayang, lalu mendarat dengan kedua kaki.'],['Jalan cepat','Pertahankan kontak kaki dengan tanah dan lakukan langkah teratur.'],['Lempar','Pelajari arah, koordinasi, dan keseimbangan dengan alat latihan yang aman.']],safety:'Pastikan lintasan bebas hambatan dan lakukan latihan sesuai kemampuan.'},
{id:'kebugaran',name:'Kebugaran Jasmani',emoji:'💪',level:'Dasar',desc:'Membangun kebiasaan aktif dan sehat.',goal:'Mengenali komponen kebugaran dan aktivitas fisik yang aman.',skills:[['Daya tahan','Aktivitas aerobik seperti jalan cepat atau bersepeda sesuai kemampuan.'],['Kekuatan','Latihan beban tubuh seperti squat ringan dan push-up modifikasi dengan teknik baik.'],['Kelenturan','Lakukan peregangan lembut tanpa memaksakan rentang gerak.'],['Keseimbangan','Latihan berdiri satu kaki dekat penyangga yang stabil.']],safety:'Tingkatkan aktivitas bertahap, minum air, dan hentikan latihan jika merasa tidak nyaman.'}
];
const questions=[
{q:'Bagian kaki yang umum digunakan untuk melakukan passing pendek yang terarah dalam sepak bola adalah…',o:['Tumit','Kaki bagian dalam','Ujung jari kaki','Lutut'],a:1,e:'Kaki bagian dalam memberikan bidang sentuh yang relatif lebar sehingga operan lebih mudah diarahkan.'},
{q:'Dalam bola voli, passing bawah dilakukan dengan menggunakan…',o:['Telapak kaki','Kepala','Kedua lengan bawah','Satu lutut'],a:2,e:'Kedua lengan bawah dirapatkan untuk membentuk bidang pantul saat menerima bola.'},
{q:'Gerakan memantulkan bola ke lantai sambil bergerak dalam bola basket disebut…',o:['Dribbling','Heading','Blocking','Servis'],a:0,e:'Dribbling adalah teknik menggiring bola dengan memantulkannya ke lantai.'},
{q:'Cabang atletik yang menggabungkan awalan, tolakan, melayang, dan pendaratan adalah…',o:['Lari estafet','Jalan cepat','Lompat jauh','Lari maraton'],a:2,e:'Lompat jauh terdiri dari awalan, tolakan, melayang, dan pendaratan.'},
{q:'Tujuan pemanasan sebelum aktivitas olahraga adalah…',o:['Membuat tubuh langsung lelah','Mempersiapkan tubuh untuk bergerak','Menggantikan latihan inti','Mengurangi kebutuhan air'],a:1,e:'Pemanasan membantu mempersiapkan tubuh dan gerak sebelum aktivitas utama.'},
{q:'Contoh aktivitas yang dapat melatih daya tahan jantung dan paru adalah…',o:['Duduk lama','Jalan cepat','Menulis','Berdiri diam'],a:1,e:'Jalan cepat merupakan aktivitas aerobik yang dapat melatih daya tahan jika dilakukan sesuai kemampuan.'},
{q:'Dalam chest pass bola basket, bola didorong dari…',o:['Belakang kepala','Depan dada','Bawah lutut','Samping pinggang'],a:1,e:'Chest pass dimulai dari depan dada dan diarahkan ke dada penerima.'},
{q:'Setelah latihan inti, kegiatan yang tepat dilakukan adalah…',o:['Langsung duduk lama','Pendinginan','Menambah beban mendadak','Berlari secepat mungkin'],a:1,e:'Pendinginan dengan gerakan ringan membantu tubuh bertransisi menuju kondisi istirahat.'}
];
const videos=[
['Pemanasan sebelum olahraga','Persiapkan tubuh dengan gerakan ringan dan dinamis sebelum latihan.','🤸'],
['Teknik passing sepak bola','Pelajari posisi kaki tumpu dan sentuhan kaki bagian dalam.','⚽'],
['Teknik passing bawah voli','Kenali posisi lengan dan sikap tubuh saat menerima bola.','🏐'],
['Dribbling bola basket','Latih kontrol pantulan bola dengan ujung jari.','🏀'],
['Pendinginan setelah olahraga','Akhiri aktivitas dengan gerakan ringan dan peregangan nyaman.','🧘']
];
let page='home',selectedSport=null,quizIndex=0,answers={},quizDone=false;
let state=JSON.parse(localStorage.getItem('pjokPintarState')||'{"completed":[],"bestScore":0,"attempts":0}');
function save(){localStorage.setItem('pjokPintarState',JSON.stringify(state))}
function go(p){page=p;selectedSport=null;document.getElementById('nav').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
function setActive(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function header(title,sub){return `<h1 class="page-title">${title}</h1><p class="lead">${sub}</p>`}
function sportCards(items=sports){return `<div class="grid">${items.map(s=>`<article class="card sport-card"><div class="sport-top">${s.emoji}</div><div class="sport-body"><span class="tag">Materi ${s.level}</span><h3>${s.name}</h3><p>${s.desc}</p><button class="btn small" onclick="openSport('${s.id}')">Pelajari materi →</button></div></article>`).join('')}</div>`}
function home(){return `<section class="hero"><div><div class="eyebrow">Belajar aktif • Bergerak sehat • Raih prestasi</div><h1>Selamat datang di<br>PJOK Pintar!</h1><p>Media pembelajaran Pendidikan Jasmani, Olahraga, dan Kesehatan yang interaktif. Pelajari materi, kenali teknik dasar, lalu uji pemahamanmu melalui kuis.</p><div class="hero-actions"><button class="btn light" onclick="go('materi')">Mulai belajar</button><button class="btn" style="background:#ffffff20;border:1px solid #ffffff55" onclick="go('kuis')">Kerjakan kuis</button></div></div><div class="hero-art">🏅⚽</div></section>
<div class="stats"><div class="stat"><div class="stat-icon">📚</div><div><strong>5</strong><span>Topik pembelajaran</span></div></div><div class="stat"><div class="stat-icon">✍️</div><div><strong>8</strong><span>Soal kuis interaktif</span></div></div><div class="stat"><div class="stat-icon">🏆</div><div><strong>${state.bestScore}</strong><span>Nilai terbaik</span></div></div></div>
<section class="section"><div class="section-head"><div><h2>Jelajahi materi</h2><p>Pilih topik yang ingin kamu pelajari.</p></div><button class="textlink" onclick="go('materi')">Lihat semua →</button></div>${sportCards()}</section>
<section class="section"><div class="section-head"><div><h2>Mulai dari sini</h2><p>Belajar bertahap dengan aktivitas singkat.</p></div></div><div class="two-col"><div class="panel"><div style="font-size:27px">🎯</div><h3>Pelajari teknik dasar</h3><p>Kenali tujuan gerak, tahapan keterampilan, dan prinsip keselamatan saat berolahraga.</p><button class="btn small" onclick="go('materi')">Buka materi</button></div><div class="panel"><div style="font-size:27px">🧠</div><h3>Uji pemahamanmu</h3><p>Kerjakan kuis pilihan ganda dan lihat hasil serta pembahasan setiap soal.</p><button class="btn small" onclick="startQuiz()">Mulai kuis</button></div></div></section>`}
function materi(){return `${header('Materi Pembelajaran','Pilih cabang olahraga untuk membaca tujuan pembelajaran, teknik dasar, dan tips keselamatan.')}<input class="search" id="sportSearch" placeholder="Cari materi olahraga..." oninput="filterSports(this.value)"><div id="sportResults" style="margin-top:15px">${sportCards()}</div>`}
function openSport(id){selectedSport=id;page='detail';render();window.scrollTo(0,0)}
function detail(){let s=sports.find(x=>x.id===selectedSport);if(!s)return materi();return `<button class="textlink" onclick="go('materi')">← Kembali ke materi</button><div class="detail-hero"><div class="big">${s.emoji}</div><span class="tag">Materi PJOK • Tingkat dasar</span><h2>${s.name}</h2><p class="muted">${s.desc}</p></div><div class="two-col"><section class="panel"><h3>🎯 Tujuan pembelajaran</h3><p>${s.goal}</p><h3 style="margin-top:20px">📖 Teknik dan konsep dasar</h3>${s.skills.map((k,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><strong>${i+1}. ${k[0]}</strong><p style="margin:5px 0 0">${k[1]}</p></div>`).join('')}</section><section class="panel"><h3>🛡️ Tips keselamatan</h3><p>${s.safety}</p><h3 style="margin-top:20px">💡 Cara belajar</h3><ul><li>Baca dan pahami tujuan setiap gerakan.</li><li>Amati contoh gerakan dari guru atau sumber pembelajaran tepercaya.</li><li>Latih secara bertahap sesuai kemampuan.</li><li>Minta umpan balik guru untuk memperbaiki teknik.</li></ul><button class="btn" onclick="startQuiz()">Uji pemahaman dengan kuis</button></section></div>`}
function videoPage(){return `${header('Video Pembelajaran','Kumpulan topik video untuk mendampingi pembelajaran. Tautan video dapat ditambahkan oleh pengelola/guru.')}<div class="grid">${videos.map((v,i)=>`<div class="card"><div class="sport-top">${v[2]}</div><div class="sport-body"><span class="tag">Video ${i+1}</span><h3>${v[0]}</h3><p>${v[1]}</p><button class="btn small outline" onclick="alert('Tambahkan tautan video pembelajaran milik guru pada bagian ini sebelum dipublikasikan.')">Tambahkan tautan video</button></div></div>`).join('')}</div><div class="panel" style="margin-top:15px"><strong>Catatan pengembangan</strong><p>Bagian ini sudah disiapkan sebagai katalog video. Untuk menampilkan video, guru dapat menambahkan tautan YouTube atau video pembelajaran yang dibuat sendiri. Pastikan konten sesuai usia dan memiliki izin penggunaan.</p></div>`}
function startQuiz(){page='kuis';quizIndex=0;answers={};quizDone=false;render();window.scrollTo(0,0)}
function quiz(){if(quizDone){let score=questions.reduce((n,q,i)=>n+(answers[i]===q.a?1:0),0),percent=Math.round(score/questions.length*100);return `${header('Hasil Kuis','Berikut hasil latihanmu. Baca pembahasan untuk memperkuat pemahaman.')}<div class="panel" style="text-align:center;padding:28px"><div style="font-size:50px">${percent>=75?'🏆':'📘'}</div><div style="font-size:48px;font-weight:900;color:var(--blue)">${percent}</div><strong>Nilai kamu</strong><p class="muted">${score} dari ${questions.length} jawaban benar</p><div class="progress" style="margin:15px 0"><span style="width:${percent}%"></span></div><p>${percent>=75?'Bagus! Pertahankan semangat belajarmu.':'Tetap semangat. Pelajari kembali materi dan coba lagi.'}</p><button class="btn" onclick="startQuiz()">Ulangi kuis</button> <button class="btn outline" onclick="go('materi')">Pelajari materi</button></div><section class="section"><h2>Pembahasan jawaban</h2>${questions.map((q,i)=>`<div class="panel" style="margin:10px 0"><strong>${i+1}. ${q.q}</strong><p>Jawaban benar: <b>${q.o[q.a]}</b></p><p>${q.e}</p><span class="tag">${answers[i]===q.a?'Benar':'Perlu dipelajari lagi'}</span></div>`).join('')}</section>`}
let q=questions[quizIndex];return `${header('Kuis PJOK','Jawab pertanyaan berikut untuk mengukur pemahamanmu.')}<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px"><span class="tag">Pertanyaan ${quizIndex+1} dari ${questions.length}</span><span class="muted" style="font-size:13px">${Math.round(quizIndex/questions.length*100)}% selesai</span></div><div class="progress" style="margin:12px 0 20px"><span style="width:${quizIndex/questions.length*100}%"></span></div><div class="quiz-q">${q.q}</div>${q.o.map((o,i)=>`<button class="option ${answers[quizIndex]===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div style="display:flex;justify-content:space-between;margin-top:18px"><button class="btn outline" onclick="quizIndex=Math.max(0,quizIndex-1);render()" ${quizIndex===0?'disabled':''}>Sebelumnya</button><button class="btn" onclick="nextQuestion()" ${answers[quizIndex]===undefined?'disabled':''}>${quizIndex===questions.length-1?'Selesaikan':'Berikutnya'}</button></div></div>`}
function choose(i){answers[quizIndex]=i;render()}
function nextQuestion(){if(answers[quizIndex]===undefined)return;if(quizIndex<questions.length-1){quizIndex++;render()}else{quizDone=true;let score=questions.reduce((n,q,i)=>n+(answers[i]===q.a?1:0),0),percent=Math.round(score/questions.length*100);state.attempts++;state.bestScore=Math.max(state.bestScore,percent);state.completed.push(new Date().toISOString());save();render()}}
function progres(){let count=state.completed.length;return `${header('Progres Belajar','Pantau aktivitas belajarmu di perangkat ini. Data tersimpan secara lokal pada browser yang digunakan.')}<div class="stats"><div class="stat"><div class="stat-icon">📝</div><div><strong>${state.attempts}</strong><span>Jumlah percobaan kuis</span></div></div><div class="stat"><div class="stat-icon">🏆</div><div><strong>${state.bestScore}</strong><span>Nilai terbaik</span></div></div><div class="stat"><div class="stat-icon">📅</div><div><strong>${count}</strong><span>Kuis diselesaikan</span></div></div></div><div class="panel" style="margin-top:16px"><h3>Ringkasan perkembangan</h3><p class="muted">Nilai terbaik yang pernah dicapai</p><div class="progress"><span style="width:${state.bestScore}%"></span></div><p><b>${state.bestScore}/100</b> ${state.bestScore>=75?'— Hasil belajar baik.':'— Terus berlatih untuk meningkatkan hasil.'}</p><button class="btn outline small" onclick="resetProgress()">Reset progres di perangkat ini</button></div><div class="panel" style="margin-top:14px"><h3>Tips meningkatkan hasil belajar</h3><ul><li>Baca materi sebelum mengerjakan kuis.</li><li>Praktikkan gerakan dengan bimbingan guru.</li><li>Ulangi kuis setelah memahami pembahasan.</li><li>Utamakan keselamatan dan kemampuan diri.</li></ul></div>`}
function resetProgress(){if(confirm('Hapus seluruh catatan progres pada perangkat ini?')){state={completed:[],bestScore:0,attempts:0};save();render()}}
function tentang(){return `${header('Tentang PJOK Pintar','Media pembelajaran digital untuk mendukung proses belajar Pendidikan Jasmani, Olahraga, dan Kesehatan.')}<div class="panel"><div style="font-size:48px">🏅</div><h2 style="color:var(--navy)">PJOK Pintar</h2><p>PJOK Pintar merupakan contoh WebApp Mobile edukatif yang dirancang untuk membantu peserta didik mengenal konsep, teknik dasar, dan keselamatan dalam aktivitas olahraga. Aplikasi ini dapat digunakan sebagai media pendamping pembelajaran, bukan pengganti arahan guru atau praktik langsung yang terawasi.</p><div class="two-col"><div><h3>Identitas proyek</h3><p><b>Nama aplikasi:</b> PJOK Pintar<br><b>Mata kuliah:</b> Media Pembelajaran Berbasis ICT<br><b>Program studi:</b> Pendidikan Jasmani, Kesehatan, dan Rekreasi<br><b>Pengembang:</b> Mahasiswa PJKR</p></div><div><h3>Tujuan aplikasi</h3><ul><li>Menyediakan materi PJOK yang mudah diakses.</li><li>Mendorong belajar mandiri dan interaktif.</li><li>Memberikan latihan evaluasi sederhana.</li><li>Mengenalkan penggunaan teknologi dalam pendidikan.</li></ul></div></div><div class="detail-hero"><b>Prinsip penggunaan aman</b><p>Sesuaikan aktivitas dengan usia dan kemampuan. Lakukan pemanasan, gunakan fasilitas yang aman, ikuti arahan guru, dan hentikan aktivitas jika merasa sakit atau tidak nyaman.</p></div></div><p class="footer">PJOK Pintar • Media Pembelajaran PJOK • Versi 1.0</p>`}
function filterSports(v){let f=sports.filter(s=>(s.name+' '+s.desc).toLowerCase().includes(v.toLowerCase()));document.getElementById('sportResults').innerHTML=f.length?sportCards(f):'<div class="empty">Materi tidak ditemukan.</div>'}
function render(){let el=document.getElementById('main');let pages={home,materi,detail,video:videoPage,kuis:quiz,progres,tentang};el.innerHTML=(pages[page]||home)();setActive()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('nav').classList.toggle('open'));
render();
</script>
</body></html>
